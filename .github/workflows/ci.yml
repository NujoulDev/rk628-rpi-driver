name: Packaging CI

on:
  push:
    branches: [debian/latest]
  pull_request:
    branches: [debian/latest]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/dkms-build.yml
    with:
      upstream-ref: main
