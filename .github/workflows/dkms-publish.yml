name: Publish DKMS release

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      version:
        type: string
        required: true
      source-tag:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      recipe-sha:
        type: string
        required: true
      artifact:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: release-${{ inputs.source-tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download release build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: artifacts/

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          RECIPE_SHA: ${{ inputs.recipe-sha }}
        shell: bash
        run: |
          cd artifacts || exit 1
          sha256sum --check SHA256SUMS
          for field in "Package: $PACKAGE" "Version: $VERSION" \
            "Source commit: $SOURCE_SHA" "Recipe commit: $RECIPE_SHA"; do
            grep -Fxq "$field" BUILD-INFO.txt
          done
          deb="${PACKAGE}_${VERSION}_all.deb"
          test "$(dpkg-deb -f "$deb" Package)" = "$PACKAGE"
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"
          dpkg-deb --extract "$deb" "$RUNNER_TEMP/release-package"
          gzip -dc "$RUNNER_TEMP/release-package/usr/share/doc/$PACKAGE/changelog.Debian.gz" \
            > "$RUNNER_TEMP/release-changelog"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Source: [$SOURCE_TAG](https://github.com/$GITHUB_REPOSITORY/tree/$SOURCE_TAG)"
            echo
            awk 'NR==1 {next} /^ -- / {exit} {print}' "$RUNNER_TEMP/release-changelog"
          } > "$notes"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp -- "$deb" "$RUNNER_TEMP/release-assets/"
          cd "$RUNNER_TEMP/release-assets" || exit 1
          sha256sum "$deb" > SHA256SUMS
          files=("$deb" SHA256SUMS)
          if gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            assets=$(gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name')
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$SOURCE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
            done <<< "$assets"
            gh release upload "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
              --clobber "${files[@]}"
          else
            gh release create "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$SOURCE_TAG" --notes-file "$notes" \
              --draft --prerelease --verify-tag "${files[@]}"
          fi
