name: RPi module build

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pios:
    name: ${{ matrix.board }} / Raspberry Pi OS stable
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pi4
            flavour: rpi-v8
          - board: pi5
            flavour: rpi-2712
    env:
      ARCH: arm64
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C
      FLAVOUR: ${{ matrix.flavour }}
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout driver source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare Raspberry Pi OS headers
        run: bash .github/scripts/prepare-pios.sh "$RUNNER_TEMP/kernel.env"

      - name: Build and verify RK628 modules
        run: bash .github/scripts/build-kmod.sh "$RUNNER_TEMP/kernel.env"

      - name: Record build result
        if: ${{ always() }}
        env:
          BOARD: ${{ matrix.board }}
          RESULT: ${{ job.status }}
        run: |
          echo "- $BOARD module build result: $RESULT" >> "$GITHUB_STEP_SUMMARY"

  pikvm:
    name: ${{ matrix.board }} / PiKVM OS stable
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        board: [pi4, pi5]
    env:
      PIKVM_REPOSITORY: https://files.pikvm.org/repos/arch/r${{ matrix.board }}-aarch64
    steps:
      - name: Checkout driver source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare official Arch Linux ARM container
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 900 \
            https://de3.mirror.archlinuxarm.org/os/ArchLinuxARM-rpi-aarch64-latest.tar.gz \
            -o "$RUNNER_TEMP/archlinuxarm.tar.gz"
          docker import --platform linux/arm64 \
            "$RUNNER_TEMP/archlinuxarm.tar.gz" rk628-archlinuxarm:ci

      - name: Prepare PiKVM headers and build modules
        run: |
          touch "$GITHUB_STEP_SUMMARY"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -v "$GITHUB_STEP_SUMMARY:/ci-summary" \
            -e PIKVM_REPOSITORY -e ARCH=arm64 -e LC_ALL=C \
            -e GITHUB_STEP_SUMMARY=/ci-summary \
            rk628-archlinuxarm:ci /bin/bash -euo pipefail -c '
              bash .github/scripts/prepare-pikvm.sh /tmp/kernel.env
              bash .github/scripts/build-kmod.sh /tmp/kernel.env
            '

      - name: Record build result
        if: ${{ always() }}
        env:
          BOARD: ${{ matrix.board }}
          RESULT: ${{ job.status }}
        run: |
          echo "- $BOARD PiKVM module build result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
